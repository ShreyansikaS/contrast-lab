<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contrast Lab – WCAG color checker</title>
<style>
:root{--bg:#f7f7f5;--ink:#1b1f24;--mut:#59616b;--line:#d8dbe0;--acc:#0b57d0}
@media(prefers-color-scheme:dark){:root{--bg:#15181c;--ink:#eceff3;--mut:#a3abb5;--line:#323841;--acc:#8ab4f8}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:860px;margin:auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin-bottom:4px}.row{display:flex;gap:8px}
input[type=color]{width:52px;height:44px;border:1px solid var(--line);background:none;padding:2px}
input[type=text]{flex:1;height:44px;padding:0 10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;border-radius:6px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#preview{margin:20px 0;padding:28px;border-radius:10px;border:1px solid var(--line)}
#preview h2{margin:0 0 6px;font-size:1.8rem}#ratio{font-size:2.6rem;font-weight:700;margin:0}
table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.pass{color:#0a7a33;font-weight:700}.fail{color:#b3261e;font-weight:700}
@media(prefers-color-scheme:dark){.pass{color:#6dd58c}.fail{color:#f2b8b5}}
button{height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
pre{background:transparent;border:1px solid var(--line);padding:12px;border-radius:6px;overflow-x:auto}
</style></head><body><main>
<h1>Contrast Lab</h1><p class="s">Check text and background colors against WCAG 2.1, then copy the result as CSS variables.</p>
<div class="grid">
 <div><label for="fgt">Text color</label><div class="row"><input type="color" id="fgc" aria-label="Text color picker" value="#1b1f24"><input type="text" id="fgt" value="#1b1f24"></div></div>
 <div><label for="bgt">Background color</label><div class="row"><input type="color" id="bgc" aria-label="Background color picker" value="#ffffff"><input type="text" id="bgt" value="#ffffff"></div></div>
</div>
<div id="preview"><p id="ratio" aria-live="polite"></p><h2>Large text sample</h2><p>Body text sample: the quick brown fox jumps over the lazy dog.</p></div>
<table><thead><tr><th>WCAG level</th><th>Needs</th><th>Result</th></tr></thead><tbody id="res"></tbody></table>
<p><button id="swap">Swap colors</button> <button id="copy">Copy CSS</button> <span id="msg" role="status"></span></p>
<pre id="css"></pre>
<script>
const $=id=>document.getElementById(id);
const hex=v=>/^#?[0-9a-f]{6}$/i.test(v.trim())?'#'+v.trim().replace('#','').toLowerCase():null;
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ratio(a,b){const[x,y]=[lum(a),lum(b)].sort((p,q)=>q-p);return(x+.05)/(y+.05)}
function update(){
 const f=hex($('fgt').value),b=hex($('bgt').value);if(!f||!b){$('ratio').textContent='Enter 6-digit hex colors like #1b1f24';return}
 $('fgc').value=f;$('bgc').value=b;const r=ratio(f,b);
 $('preview').style.cssText=`color:${f};background:${b}`;$('ratio').textContent=r.toFixed(2)+' : 1';
 const t=[['AA normal text',4.5],['AA large text',3],['AAA normal text',7],['AAA large text',4.5],['AA UI components',3]];
 $('res').innerHTML=t.map(([n,m])=>`<tr><td>${n}</td><td>${m}:1</td><td class="${r>=m?'pass':'fail'}">${r>=m?'Pass':'Fail'}</td></tr>`).join('');
 $('css').textContent=`:root {\n  --text: ${f};\n  --surface: ${b};\n  /* contrast ${r.toFixed(2)}:1 */\n}`;
}
['fgt','bgt'].forEach(i=>$(i).addEventListener('input',update));
$('fgc').addEventListener('input',e=>{$('fgt').value=e.target.value;update()});
$('bgc').addEventListener('input',e=>{$('bgt').value=e.target.value;update()});
$('swap').onclick=()=>{[$('fgt').value,$('bgt').value]=[$('bgt').value,$('fgt').value];update()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('css').textContent);$('msg').textContent='Copied'}catch{$('msg').textContent='Copy failed. Select the text manually.'}};
update();
</script></main></body></html>
